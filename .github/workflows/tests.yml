name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # PixHerder is Windows-only (junctions, PowerShell recycle, drive letters)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = bundled runtime (setup.bat), 3.14 = current dev environment
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=11.2,<13.0" "imagehash>=4.3" "pywebview>=5.0" pytest
      - name: Install HEIF support (wheel-only — skipped when unavailable)
        run: pip install --only-binary pillow-heif "pillow-heif>=0.18,<1.0"
        continue-on-error: true
      - name: Run test suite
        run: python -m pytest
